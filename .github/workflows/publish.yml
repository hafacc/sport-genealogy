name: publish

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      upload-pages: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  poster:
    needs: build
    # the poster is set in Avenir Next, which only macOS ships
    runs-on: macos-latest
    defaults:
      run:
        # naming the shell turns on pipefail, so a failed render fails the job
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: brew install librsvg
      - run: bun src/poster.ts | rsvg-convert -f pdf -o sport-genealogy-poster.pdf
      # the site links to this file name on the latest release
      # dated, because run numbers restart whenever the workflow is renamed
      - run: gh release create "poster-$(date -u +%Y%m%d-%H%M%S)" sport-genealogy-poster.pdf --target "${{ github.sha }}" --notes "" --latest
        env:
          GH_TOKEN: ${{ github.token }}
